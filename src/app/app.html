<header class="site">
  <a class="mark" routerLink="/">QuickBank</a>
  @if (auth.signedIn()) {
    <button type="button" class="drawer-toggle" (click)="drawerOpen.set(!drawerOpen())">Menu</button>
    <div class="session">
      @if (auth.username(); as name) {
        <span class="who">{{ name }}</span>
      }
      <button type="button" class="quiet" (click)="auth.signOut()">Sair</button>
    </div>
  } @else if (auth.sessionReady()) {
    <nav class="public-nav">
      <a routerLink="/entrar">Entrar</a>
      <a class="public-cta" routerLink="/cadastro">Abrir conta</a>
    </nav>
  }
</header>
@if (auth.signedIn()) {
  <div class="shell">
    @if (drawerOpen()) {
      <button type="button" class="backdrop" aria-label="Fechar menu" (click)="drawerOpen.set(false)"></button>
    }
    <app-drawer [open]="drawerOpen()" (navigated)="drawerOpen.set(false)" />
    <main class="shell-main">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
